trigger: none
pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  displayName: 'Index de l environnement cible (seulement pour un déploiement sur env de DEV)'
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'

resources:
  repositories:
  - repository: Pulse
    name: 'Constellation/ConstellationDevOps'
    type: git
    ref: 'refs/heads/Release/v2.0'

extends:
  template: pipelines/templates/platform.back.api.yaml@Pulse
  parameters:
    devIndex: ${{ parameters.devIndex }}
    deployType: ${{ parameters.deployType }}
    layer: Domain
    domain: mdt
    resource:
      id: '01'
      name: 'mandate'
      path: 01_API\src\Api\Mandate.AspNetCore.csproj
      tests: 01_API\tests\**\*.csproj
      type: 'webApp' 
    dotnetcore: 6.x