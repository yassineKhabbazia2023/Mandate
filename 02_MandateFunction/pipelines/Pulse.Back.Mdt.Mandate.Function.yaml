trigger: none
pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  displayName: 'Index de l environnement cible (seulement pour un déploiement sur env de DEV)'
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'

resources:
  repositories:
  - repository: Pulse
    name: 'Constellation/ConstellationDevOps'
    type: git
    ref: 'refs/heads/Release/v2.0'

extends:
  template: pipelines/templates/platform.back.api.yaml@Pulse
  parameters:
    devIndex: ${{ parameters.devIndex }}
    deployType: ${{ parameters.deployType }}
    layer: Domain
    domain: mdt
    resource:
      id: '02'
      name: 'mdtFunction2'
      path: 02_MandateFunction\src\Mandate.AzureFunctions\KPMG.Pulse.Back.Accounting.Mandate.Function.csproj
      tests: 02_MandateFunction\tests\**\*.csproj
      type: 'functionApp' 
    dotnetcore: 6.x