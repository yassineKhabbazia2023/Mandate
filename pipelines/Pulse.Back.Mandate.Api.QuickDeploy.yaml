trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: deployToDev
  displayName: 'Déployer sur DEV'
  type: boolean
  default: true
- name: deployToItg
  displayName: 'Déployer sur ITG'
  type: boolean
  default: true

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'refs/heads/Release/v4.0'

extends:
  template: pipelines/quick-build/back.yaml@Pulse
  parameters:
    deployToDev: ${{ parameters.deployToDev }}
    deployToItg: ${{ parameters.deployToItg }}
    srcPath: 01_API/src/Api/Mandate.AspNetCore.csproj
    domain: mdt
    name: mandate
    appType: webApp
    id: '01'