trigger:
  branches:
    include:
     - main
     - bugfix/*
  paths:
    include:
    - 02_MandateFunction

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: deployToDev
  displayName: 'Déployer sur DEV'
  type: boolean
  default: false
- name: deployToItg
  displayName: 'Déployer sur ITG'
  type: boolean
  default: true
- name: deployToRec
  displayName: 'Déployer sur REC'
  type: boolean
  default: true
- name: deployToPrd
  displayName: 'Déployer sur PROD'
  type: boolean
  default: true


resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'refs/heads/Release/v4.0'

extends:
  template: pipelines/delivery/back.yaml@Pulse
  parameters:
    deployToDev: ${{ parameters.deployToDev }}
    deployToItg: ${{ parameters.deployToItg }}
    deployToRec: ${{ parameters.deployToRec }}
    deployToPrd: ${{ parameters.deployToPrd }}
    srcPath: 02_MandateFunction/src/Mandate.AzureFunctions/KPMG.Pulse.Back.Accounting.Mandate.Function.csproj
    testsPath: 02_MandateFunction/tests/**/*.csproj
    sonarExclusions: '**/Program.cs'
    domain: mdt
    name: mdtFunction
    appType: functionApp
    id: '02'